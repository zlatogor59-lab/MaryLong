name: Food catalog verification

on:
  push:
    paths:
      - '**'
  pull_request:
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: food-catalog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: consultant_catalog_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d consultant_catalog_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/consultant_catalog_ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Run complete catalog verification
        run: pnpm food-products:verify --confirm-database=consultant_catalog_ci
      - name: Publish verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: food-catalog-verification-${{ github.run_attempt }}
          path: .artifacts/food-catalog-verification.json
          if-no-files-found: warn
          retention-days: 30
